name: Track flight prices

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 06:17 Cotonou time (05:17 UTC)
  push:
    paths: [diagnose.py]   # changing the diagnostics script runs it once
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [track, test-telegram, diagnose]
        default: track

permissions:
  contents: write

concurrency: flight-tracker

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Diagnose search problems
        if: inputs.mode == 'diagnose' || github.event_name == 'push'
        run: |
          python diagnose.py || true
          git config user.name "flight-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics.txt
          git commit -m "Diagnostics $(date -u +%FT%H%M)" && git push || true

      - name: Send a test message to Telegram
        if: inputs.mode == 'test-telegram'
        run: python tracker.py --test-telegram

      - name: Check prices
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: python tracker.py

      - name: Save prices and dashboard
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: |
          git config user.name "flight-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Prices $(date -u +%F)"
          git push
